<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="color-scheme" content="dark">
<title>No1EqualsMe</title>
<style>
  :root {
    /* Переменные темы Telegram подхватываются автоматически внутри клиента,
       вне Telegram используются значения по умолчанию */
    --bg:        var(--tg-theme-bg-color, #0e1621);
    --bg-2:      var(--tg-theme-secondary-bg-color, #17212b);
    --text:      var(--tg-theme-text-color, #f2f6fb);
    --hint:      var(--tg-theme-hint-color, #8794a5);
    --btn:       var(--tg-theme-button-color, #3f9ce8);
    --btn-text:  var(--tg-theme-button-text-color, #ffffff);
    --accent:    #54a9eb;
    --ok:        #4ade80;
    --radius:    16px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
    overflow: hidden;
  }

  .scene {
    position: relative;
    height: 100vh;                /* fallback */
    height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 20px calc(24px + env(safe-area-inset-bottom, 0px));
    isolation: isolate;
  }

  /* Мягкое свечение фона */
  .scene::before,
  .scene::after {
    content: "";
    position: absolute;
    z-index: -1;
    border-radius: 50%;
    filter: blur(90px);
    opacity: .35;
    pointer-events: none;
  }
  .scene::before {
    width: 320px; height: 320px;
    top: -80px; right: -100px;
    background: radial-gradient(circle, #2e7fd4 0%, transparent 70%);
  }
  .scene::after {
    width: 380px; height: 380px;
    bottom: -140px; left: -140px;
    background: radial-gradient(circle, #1c4f8a 0%, transparent 70%);
  }

  /* ---------- Центральный блок ---------- */
  .hero {
    flex: 1;
    width: 100%;
    max-width: 420px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 22px;
    text-align: center;
  }

  .logo {
    width: 92px;
    height: 92px;
    border-radius: 28px;
    display: grid;
    place-items: center;
    font-size: 34px;
    font-weight: 800;
    letter-spacing: -1px;
    color: #fff;
    background: linear-gradient(160deg, #54a9eb 0%, #2a7fd0 55%, #1c5d9e 100%);
    box-shadow:
      0 12px 32px rgba(46, 127, 212, .35),
      inset 0 1px 0 rgba(255, 255, 255, .25);
    animation: rise .7s cubic-bezier(.2, .8, .2, 1) both;
  }

  .title {
    font-size: clamp(26px, 8vw, 34px);
    font-weight: 800;
    letter-spacing: -.5px;
    line-height: 1.1;
    background: linear-gradient(180deg, #ffffff 30%, #aecbea 100%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    color: transparent;
    animation: rise .7s .08s cubic-bezier(.2, .8, .2, 1) both;
  }

  .status {
    display: inline-flex;
    align-items: center;
    gap: 9px;
    padding: 10px 16px;
    border-radius: 999px;
    border: 1px solid rgba(74, 222, 128, .25);
    background: rgba(74, 222, 128, .08);
    color: var(--ok);
    font-size: 13.5px;
    font-weight: 600;
    line-height: 1.35;
    max-width: 320px;
    animation: rise .7s .16s cubic-bezier(.2, .8, .2, 1) both;
  }
  .status svg { flex: none; }

  /* ---------- Кнопка ---------- */
  .cta {
    width: 100%;
    max-width: 420px;
    appearance: none;
    border: none;
    cursor: pointer;
    padding: 17px 20px;
    border-radius: var(--radius);
    font-family: inherit;
    font-size: 16.5px;
    font-weight: 700;
    letter-spacing: .2px;
    color: var(--btn-text);
    background: linear-gradient(180deg, #5cb0ef 0%, var(--btn) 60%, #2f8ad6 100%);
    box-shadow:
      0 10px 26px rgba(63, 156, 232, .35),
      inset 0 1px 0 rgba(255, 255, 255, .3);
    transition: transform .12s ease, box-shadow .12s ease, filter .2s ease;
    animation: rise .7s .24s cubic-bezier(.2, .8, .2, 1) both;
  }
  .cta:hover  { filter: brightness(1.06); }
  .cta:active {
    transform: translateY(2px) scale(.985);
    box-shadow:
      0 4px 14px rgba(63, 156, 232, .3),
      inset 0 1px 0 rgba(255, 255, 255, .2);
    filter: brightness(.97);
  }
  .cta:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 3px;
  }

  .note {
    margin-top: 12px;
    font-size: 12px;
    color: var(--hint);
    animation: rise .7s .3s cubic-bezier(.2, .8, .2, 1) both;
  }

  @keyframes rise {
    from { opacity: 0; transform: translateY(16px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
  <div class="scene">
    <div class="hero">
      <div class="logo" aria-hidden="true">N1</div>

      <h1 class="title">No1EqualsMe</h1>

      <div class="status" role="status">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="2.2"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="10" opacity=".45"></circle>
          <path d="M8 12.5l2.7 2.7L16.5 9"></path>
        </svg>
        <span>Telegram Mini App подключён успешно</span>
      </div>
    </div>

    <button class="cta" type="button">Начать</button>
    <div class="note">Тестовая сборка · без внешних зависимостей</div>
  </div>
</body>
</html>
